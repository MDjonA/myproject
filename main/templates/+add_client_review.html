<h2 style="margin-bottom: 20px;">Оставить отзыв о клиенте {{ client.user.username }}</h2>

<form method="POST"
      style="max-width: 450px; padding: 20px; border: 1px solid #ccc; border-radius: 10px; background: #fafafa;">
    {% csrf_token %}

    <div style="margin-bottom: 15px;">
        <label for="rating" style="display: block; font-weight: bold; margin-bottom: 5px;">
            Оценка (1–5)
        </label>
        <input type="number" id="rating" name="rating" min="1" max="5"
               style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #bbb;">
    </div>

    <div style="margin-bottom: 20px;">
        <label for="text" style="display: block; font-weight: bold; margin-bottom: 5px;">
            Отзыв
        </label>
        <textarea id="text" name="text" placeholder="Напишите отзыв"
                  style="width: 100%; height: 120px; padding: 10px; border-radius: 6px; border: 1px solid #bbb;"></textarea>
    </div>

    <button type="submit"
            style="width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-size: 16px;">
        Отправить отзыв
    </button>
</form>
