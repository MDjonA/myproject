<h2 style="margin-bottom: 20px;">Создать заказ</h2>

<div style="max-width: 500px; padding: 20px; border: 1px solid #ccc; border-radius: 10px; background: #fafafa;">

    <p style="margin-bottom: 10px;">
        <strong>Услуга:</strong> {{ service.title }}
    </p>

    <p style="margin-bottom: 20px;">
        <strong>Мастер:</strong> {{ service.master.user.username }}
    </p>

    <form method="POST">
        {% csrf_token %}

        <div style="margin-bottom: 20px;">
            <label for="details" style="display: block; font-weight: bold; margin-bottom: 5px;">
                Описание задачи
            </label>
            <textarea id="details" name="details" placeholder="Опишите задачу"
                      style="width: 100%; height: 140px; padding: 10px; border-radius: 6px; border: 1px solid #bbb;"></textarea>
        </div>

        <button type="submit"
                style="width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-size: 16px;">
            Создать заказ
        </button>
    </form>

</div>
