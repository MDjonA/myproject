<h2>Вход в аккаунт</h2>

<form method="POST" style="max-width: 350px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background: #fafafa;">
    {% csrf_token %}

    <div style="margin-bottom: 15px;">
        <label for="username" style="display: block; font-weight: bold; margin-bottom: 5px;">Логин</label>
        <input type="text" id="username" name="username" placeholder="Введите логин"
               style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #bbb;">
    </div>

    <div style="margin-bottom: 15px;">
        <label for="password" style="display: block; font-weight: bold; margin-bottom: 5px;">Пароль</label>
        <input type="password" id="password" name="password" placeholder="Введите пароль"
               style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #bbb;">
    </div>

    <button type="submit"
            style="width: 100%; padding: 10px; background: #2196F3; color: white; border: none; border-radius: 5px; font-size: 16px;">
        Войти
    </button>
</form>
