<h2 style="margin-bottom: 20px;">Мои услуги</h2>

<div style="margin-bottom: 20px;">
    <a href="/master/services/add/" 
       style="display: inline-block; padding: 10px 15px; background: #4CAF50; color: white; border-radius: 6px; text-decoration: none;">
        Добавить услугу
    </a>
</div>

<ul style="list-style: none; padding: 0;">
    {% for s in services %}
        <li style="margin-bottom: 15px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; background: #fafafa;">
            <p><strong>Название:</strong> {{ s.title }}</p>
            <p><strong>Цена:</strong> {{ s.price }} zł</p>
        </li>
    {% empty %}
        <li style="padding: 10px; color: #777;">У вас пока нет услуг</li>
    {% endfor %}
</ul>
