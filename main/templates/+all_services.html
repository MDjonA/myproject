<h2 style="margin-bottom: 20px;">Все услуги</h2>

<ul style="list-style: none; padding: 0;">
    {% for s in services %}
        <li style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; background: #fafafa;">

            <p><strong>Название:</strong> {{ s.title }}</p>
            <p><strong>Цена:</strong> {{ s.price }} zł</p>

            <div style="margin-top: 10px;">
                <a href="/order/create/{{ s.id }}/"
                   style="display: inline-block; padding: 8px 12px; background: #2196F3; color: white; border-radius: 6px; text-decoration: none;">
                    Заказать
                </a>
            </div>

        </li>
    {% endfor %}
</ul>
