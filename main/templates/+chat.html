<h2 style="margin-bottom: 20px;">Чат по заказу №{{ order.id }}</h2>

<div style="max-width: 600px; padding: 20px; border: 1px solid #ccc; border-radius: 10px; background: #fafafa; margin-bottom: 20px;">

    {% for m in messages %}
        <div style="margin-bottom: 15px; padding: 10px; border-bottom: 1px solid #ddd;">
            <p style="margin: 0;">
                <strong>{{ m.sender.username }}:</strong>
            </p>
            <p style="margin: 5px 0;">
                {{ m.text }}
            </p>
            <small style="color: #777;">{{ m.timestamp }}</small>
        </div>
    {% endfor %}

</div>

<form method="POST" style="max-width: 600px;">
    {% csrf_token %}

    <div style="margin-bottom: 15px;">
        <label for="text" style="display: block; font-weight: bold; margin-bottom: 5px;">
            Ваше сообщение
        </label>
        <textarea id="text" name="text" placeholder="Введите сообщение"
                  style="width: 100%; height: 120px; padding: 10px; border-radius: 6px; border: 1px solid #bbb;"></textarea>
    </div>

    <button type="submit"
            style="width: 100%; padding: 12px; background: #2196F3; color: white; border: none; border-radius: 6px; font-size: 16px;">
        Отправить
    </button>
</form>
