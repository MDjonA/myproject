<h1 style="margin-bottom: 20px;">Личный кабинет</h1>

<div style="
    max-width: 450px;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background: #fafafa;
">

    <p style="font-size: 18px; margin-bottom: 15px;">
        <strong>Добро пожаловать, {{ request.user.username }}!</strong>
    </p>

    <p style="margin-bottom: 15px;">
        <strong>Ваш статус:</strong>
        {% if request.user.userprofile.is_master %}
            Мастер
        {% elif request.user.userprofile.is_client %}
            Клиент
        {% endif %}
    </p>

    <div style="margin-bottom: 20px;">
        <a href="/choose-role/"
           style="display: inline-block; padding: 8px 12px; background: #2196F3; color: white; border-radius: 6px; text-decoration: none;">
            Изменить роль
        </a>
    </div>

    {% if request.user.userprofile.is_master %}
        <div style="margin-top: 10px;">
            <a href="/master/orders/"
               style="display: inline-block; padding: 8px 12px; background: #4CAF50; color: white; border-radius: 6px; text-decoration: none;">
                Мои заказы
            </a>
        </div>
    {% endif %}

</div>
